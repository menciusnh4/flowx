appId: com.flowx.desktop
productName: FlowX
directories:
  output: release
  buildResources: build
afterPack: scripts/afterPack.js
files:
  - dist/**/*
  - dist-electron/**/*
  - node_modules/**/*
  - CHANGELOG.md
  - "!node_modules/*/{test,__tests__,tests,powered-test,example,examples}"
  - "!node_modules/*.d.ts"
  - "!node_modules/.bin"
  - "!node_modules/**/*.{iml,o,hprof,orig,pyc,pyo,rbc,swp,cache,info}"
  - "!**/node_modules/*/{CHANGELOG.md,README.md,README,readme.md,readme}"
  - "!**/node_modules/*/{test,__tests__,tests,powered-test,example,examples}"
  - "!**/*.{iml,o,hprof,orig,pyc,pyo,rbc,swp,cache,info,map}"
  - "!**/{.DS_Store,.git,.hg,.svn,CVS,RCS,SCCS,.gitignore,.gitattributes}"
  - "!**/{__pycache__,thumbs.db,.flowconfig,.idea,.vs,.nyc_output}"
  - "!**/{appveyor.yml,.travis.yml,circle.yml}"
  - "!**/{npm-debug.log,yarn.lock,.yarn-integrity,.yarn-metadata.json}"
extraResources:
  # 托盘资源：TrayService 在运行时会从 process.resourcesPath 读取以下图标
  - from: build/icon.png
    to: icon.png
  - from: build/icon.ico
    to: icon.ico
  # 如果 build/icon.icns 不存在则跳过（electron-builder 只复制已存在的文件）
  - from: build/icon.icns
    to: icon.icns
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
  artifactName: "${productName}-${version}-setup.${ext}"
  signAndEditExecutable: false
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: FlowX
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  deleteAppDataOnUninstall: true
mac:
  # electron-builder 会自动把高分辨率 PNG 转换为 icns，
  # 放在 .app/Contents/Resources/appIcon.icns（TrayService 在 macOS 打包下优先读取该路径）
  icon: build/icon.png
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  category: public.app-category.productivity
  # macOS：硬链接加固 + 扩展安全
  hardenedRuntime: false
  gatekeeperAssess: false
linux:
  icon: build/icon.png
  target: AppImage
publish:
  provider: generic
  url: "https://update.flowx.com/${os}/"
